apis:
- aid: typo3:headless-json-api
  name: TYPO3 Headless JSON Content API
  description: >-
    The TYPO3 Headless extension provides a JSON API for delivering page content, navigation structures,
    layouts, and media to decoupled frontend applications. Responds with JSON when the Accept header is
    set to application/json, enabling hybrid HTML and headless deployments from a single TYPO3 instance.
  image: https://kinlane-images.s3.amazonaws.com/shared/apis-json/apis-json-logo.jpg
  humanURL: https://docs.typo3.org/p/friendsoftypo3/headless/main/en-us/Index.html
  baseURL: https://example.typo3.org
  tags:
  - Content
  - Pages
  - Navigation
  - JSON
  - Headless
  - PWA
  properties:
  - type: Documentation
    url: https://docs.typo3.org/p/friendsoftypo3/headless/main/en-us/Index.html
  - type: GitHubRepository
    url: https://github.com/TYPO3-Headless/headless
  - type: Extensions
    url: https://extensions.typo3.org/extension/headless
- aid: typo3:extension-rest-api
  name: TYPO3 REST API Extension (t3api)
  description: >-
    The sourcebroker/t3api extension provides an easy-to-configure REST API layer for TYPO3 Extbase models.
    APIs are configured with PHP annotations on classes, properties, and methods, with partial support
    for JSON-LD and Hydra for auto-discoverable frontend applications.
  image: https://kinlane-images.s3.amazonaws.com/shared/apis-json/apis-json-logo.jpg
  humanURL: https://docs.typo3.org/p/sourcebroker/t3api/main/en-us/
